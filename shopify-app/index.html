<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="shopify-api-key" content="%%SHOPIFY_API_KEY%%" />
  <title>edXdocu — Hazır fatura şablonları</title>
  <!-- Mutlak yollar: App URL /shopify (slash’siz) olunca ./styles.css kökte 404 oluyordu. -->
  <base href="/shopify/" />
  <link rel="stylesheet" href="/shopify/styles.css" />
  <!-- App Store embedded check: App Bridge from Shopify CDN -->
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>edXdocu</h1>
        <p>Hazır e-fatura / irsaliye XSLT şablonları</p>
      </div>
      <div class="shop-pill" id="shop-pill">Mağaza: …</div>
    </header>

    <div class="steps" id="steps" aria-label="Sihirbaz adımları"></div>
    <div id="msg" class="msg" hidden></div>
    <div id="main"></div>
  </div>
  <script src="/shopify/app.js" defer></script>
</body>
</html>
