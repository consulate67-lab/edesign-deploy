# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "EdXDocu"
client_id = "0ae9f421020b01bf5eeca0cb3cfe7857"
application_url = "https://www.edxdocu.com/shopify"
embedded = true

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "https://www.edxdocu.com/api/shopify/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders"

[auth]
redirect_urls = [ "https://www.edxdocu.com/shopify", "https://www.edxdocu.com/api/shopify/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
