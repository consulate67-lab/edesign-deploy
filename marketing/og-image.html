<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(700px 420px at 8% 0%, rgba(249, 115, 22, 0.14), transparent 65%),
      radial-gradient(800px 480px at 100% 100%, rgba(109, 40, 217, 0.18), transparent 65%),
      #f8f9fb;
    color: #0b1324;
    display: flex; align-items: center;
  }
  .wrap { display: flex; align-items: center; gap: 56px; padding: 0 72px; width: 100%; box-sizing: border-box; }
  .left { flex: 1; }
  .logo { width: 330px; display: block; margin-bottom: 30px; }
  h1 { font-size: 62px; line-height: 1.08; margin: 0 0 22px; font-weight: 800; letter-spacing: -1px; }
  h1 span { color: #6d28d9; }
  p { font-size: 27px; line-height: 1.4; margin: 0 0 30px; color: #4a5568; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { background: #ede9fe; color: #5b21b6; font-weight: 700; font-size: 21px; padding: 9px 18px; border-radius: 999px; }
  .card { width: 360px; background: #fff; border-radius: 22px; box-shadow: 0 24px 60px rgba(15, 23, 42, .14); padding: 26px; box-sizing: border-box; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; }
  .lg { background: #ede9fe; border: 2px dashed #a78bfa; color: #6d28d9; font-weight: 800; font-size: 14px; padding: 10px 14px; border-radius: 8px; }
  .t { color: #6d28d9; font-weight: 800; font-size: 20px; text-align: right; }
  .s { color: #7a8599; font-size: 13px; text-align: right; margin-top: 4px; }
  .co { font-weight: 700; font-size: 15px; margin-top: 12px; }
  .th { margin-top: 18px; background: #6d28d9; color: #fff; font-weight: 700; font-size: 13px; padding: 8px 10px; border-radius: 6px 6px 0 0; display: flex; justify-content: space-between; }
  .tr { display: flex; justify-content: space-between; font-size: 13px; padding: 9px 10px; border-bottom: 1px solid #e4e7ef; }
  .bar { height: 8px; background: #e4e7ef; border-radius: 4px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .stamp { width: 66px; height: 66px; border: 3px solid #ef4444; border-radius: 50%; color: #ef4444; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); }
  .url { position: absolute; bottom: 30px; left: 72px; font-size: 22px; font-weight: 700; color: #6d28d9; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <img class="logo" src="../public/logo-600x200.png" alt="edXdocu">
      <h1>e-Belge tasarımı<br>artık <span>çok kolay</span></h1>
      <p>XSLT bilmeden, sürükle-bırak ile.<br>GİB UBL-TR uyumlu, 15 belge türü.</p>
      <div class="chips">
        <span class="chip">e-Fatura</span><span class="chip">e-Arşiv</span><span class="chip">e-İrsaliye</span><span class="chip">+12</span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div><div class="lg">LOGONUZ</div><div class="co">Örnek Kırtasiye Ltd.</div></div>
        <div><div class="t">e-Arşiv Fatura</div><div class="s">EAR2026000000123</div></div>
      </div>
      <div class="th"><span>Ürün / Hizmet</span><span>Tutar</span></div>
      <div class="tr"><span>A4 Fotokopi Kâğıdı</span><span>•••</span></div>
      <div class="tr"><span>Toner</span><span>•••</span></div>
      <div class="tr"><span>Kartuş</span><span>•••</span></div>
      <div class="foot">
        <div style="width:160px"><div class="bar" style="width:100%"></div><div class="bar" style="width:70%;margin-top:8px"></div></div>
        <div class="stamp">KAŞE</div>
      </div>
    </div>
  </div>
  <div class="url">www.edxdocu.com</div>
</body>
</html>
