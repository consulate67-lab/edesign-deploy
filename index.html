<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="description" content="GİB uyumlu e-Fatura, e-Arşiv, e-İrsaliye ve 12 e-belge türü için XSLT bilgisi gerektirmeyen tasarım aracı." />
    <title>edXdocu — eBelge Tasarımcı</title>
    <link rel="preload" as="image" href="logo-intro-x.png" />
    <script>
      // The intro plays once per browser session and never on the admin panel.
      try {
        if (sessionStorage.getItem('edx-intro') || /^#\/(yonetim|admin)(\/|$)/i.test(location.hash)) {
          document.documentElement.classList.add('edx-skip');
        } else {
          sessionStorage.setItem('edx-intro', '1');
        }
      } catch (e) { /* storage blocked: play the intro */ }
    </script>
    <style>
      html.edx-skip #edx-intro { display: none; }
      #edx-intro {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(700px 420px at 15% 10%, rgba(249, 115, 22, 0.10), transparent 65%),
          radial-gradient(700px 420px at 85% 90%, rgba(71, 125, 140, 0.12), transparent 65%),
          #f8f9fb;
        cursor: pointer;
        transition: opacity .5s ease, visibility .5s ease;
      }
      #edx-intro.edx-done { opacity: 0; visibility: hidden; }
      .edx-stage { position: relative; width: min(78vw, 480px); aspect-ratio: 3 / 1; }
      .edx-stage img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; user-select: none; -webkit-user-drag: none; }
      .edx-x { transform-origin: 43.7% 50%; animation: edx-x .85s cubic-bezier(.2, 1.3, .35, 1) .1s forwards; }
      .edx-ed { animation: edx-left .65s cubic-bezier(.2, .85, .25, 1) .6s forwards; }
      .edx-doc { animation: edx-right .65s cubic-bezier(.2, .85, .25, 1) .6s forwards; }
      .edx-shine {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .6) 50%, transparent 65%) no-repeat;
        background-size: 250% 100%; background-position: 130% 0;
        -webkit-mask: url(logo-600x200.png) center / 100% 100% no-repeat;
        mask: url(logo-600x200.png) center / 100% 100% no-repeat;
        animation: edx-shine .8s ease-in-out 1.25s forwards;
      }
      .edx-tag {
        font: 600 13px/1 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: .32em; text-transform: uppercase; color: #64748b;
        opacity: 0; animation: edx-fade .6s ease 1.15s forwards;
      }
      @keyframes edx-x {
        0% { opacity: 0; transform: scale(2.6) rotate(-140deg); }
        55% { opacity: 1; }
        100% { opacity: 1; transform: none; }
      }
      @keyframes edx-left { from { opacity: 0; transform: translateX(-16%); } to { opacity: 1; transform: none; } }
      @keyframes edx-right { from { opacity: 0; transform: translateX(16%); } to { opacity: 1; transform: none; } }
      @keyframes edx-shine { 0% { opacity: 1; background-position: 130% 0; } 100% { opacity: 1; background-position: -30% 0; } }
      @keyframes edx-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .edx-stage img, .edx-tag { animation: none; opacity: 1; }
        .edx-shine { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="edx-intro" aria-hidden="true">
      <div class="edx-stage">
        <img class="edx-ed" src="logo-intro-ed.png" alt="" />
        <img class="edx-doc" src="logo-intro-doc.png" alt="" />
        <img class="edx-x" src="logo-intro-x.png" alt="" />
        <span class="edx-shine"></span>
      </div>
      <div class="edx-tag">eBelge Tasarımcı</div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('edx-intro');
        if (!el) return;
        if (document.documentElement.classList.contains('edx-skip')) { el.remove(); return; }
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var start = Date.now(), minMs = reduced ? 700 : 2300, maxMs = 7000, done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add('edx-done');
          setTimeout(function () { el.remove(); }, 550);
        }
        el.addEventListener('click', hide);
        (function wait() {
          var root = document.getElementById('root'), spent = Date.now() - start;
          if (spent >= maxMs || (spent >= minMs && root && root.childElementCount > 0)) return hide();
          setTimeout(wait, 100);
        })();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
